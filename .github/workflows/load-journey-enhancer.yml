name: Load isolated journey enhancer
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag only when missing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./journey-enhancer.js" defer></script>'
          if tag in s:
              raise SystemExit(0)
          s=s.replace('</body>', '  '+tag+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          if grep -q 'journey-enhancer.js' index.html && git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load isolated journey enhancer"
          git push
